<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <defs>
    <linearGradient id="lensOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="lensRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="lensGlass" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.7" />
    </linearGradient>
    <radialGradient id="lensReflection" cx="35%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Lens Icon Container -->
  <g transform="translate(10, 8)">
    <!-- Outer Rim -->
    <circle cx="32" cy="32" r="32" fill="url(#lensOuter)" stroke="#44403c" stroke-width="2"/>
    <!-- Red Accent Ring -->
    <circle cx="32" cy="32" r="27" fill="none" stroke="url(#lensRing)" stroke-width="2.5"/>
    <!-- Inner Lens Chamber -->
    <circle cx="32" cy="32" r="22" fill="#0c0a09" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.8"/>
    <!-- Aperture Blades (Stylized geometric) -->
    <polygon points="32,12 39,24 25,24" fill="#1c1917" opacity="0.6"/>
    <polygon points="48,22 44,36 34,28" fill="#1c1917" opacity="0.6"/>
    <polygon points="48,42 36,46 36,34" fill="#1c1917" opacity="0.6"/>
    <polygon points="32,52 25,40 39,40" fill="#1c1917" opacity="0.6"/>
    <polygon points="16,42 20,28 30,36" fill="#1c1917" opacity="0.6"/>
    <polygon points="16,22 28,18 28,30" fill="#1c1917" opacity="0.6"/>
    <!-- Coated Optical Core -->
    <circle cx="32" cy="32" r="14" fill="url(#lensGlass)"/>
    <!-- Specular Highlight -->
    <ellipse cx="27" cy="27" rx="5" ry="3" transform="rotate(-30 27 27)" fill="url(#lensReflection)"/>
    <circle cx="32" cy="32" r="2" fill="#ffffff" opacity="0.9"/>
    <!-- Recording Dot indicator -->
    <circle cx="56" cy="10" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Typography: BLACK LENS -->
  <text x="88" y="46" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.03em" fill="#0c0a09">
    BLACK <tspan fill="#b91c1c">LENS</tspan>
  </text>
  
  <!-- Subtitle Tagline in Devanagari Hindi -->
  <text x="90" y="66" font-family="'Mukta', 'Noto Sans Devanagari', system-ui, sans-serif" font-weight="700" font-size="12.5" letter-spacing="0.04em" fill="#b91c1c">
    सटीक खबर, पैनी नज़र · डिजिटल न्यूज़
  </text>
</svg>
